<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuide bem da sua mandioca</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="festa" class="festa"><canvas id="festa-canvas" aria-label="A festa junina da Mandioca" data-i18n-label="app.canvas"></canvas></div>
  <div id="zoom-guia" class="zoom-guia" hidden aria-hidden="true"><b></b></div>
  <section id="casa" class="casa ui" hidden aria-label="Casa da Mandioca" data-i18n-label="casa.title">
    <header class="casa-topo">
      <h2 data-i18n="casa.title">Casa da Mandioca</h2>
      <span id="casa-contagem" class="casa-contagem"></span>
      <button class="ajuda" data-action="casa-ajuda" title="Como funciona" data-i18n-title="help.button" data-i18n-label="help.button">?</button>
      <button class="fechar" data-action="casa-fechar" title="Esconder a casa" data-i18n-title="casa.hide">×</button>
    </header>
    <div id="casa-cena" class="casa-cena"><canvas id="casa-canvas" aria-label="A casa da Mandioca e seus moradores" data-i18n-label="casa.title"></canvas>
      <div id="casa-ajuda" class="ajuda-painel" data-action="casa-ajuda" hidden><h3></h3><p></p><small></small></div></div>
  </section>
  <div id="placa" class="placa ui" aria-live="polite"></div>
  <section id="vitrine" class="vitrine ui" hidden aria-label="Vitrine de compras" data-i18n-label="app.shopLabel"></section>
  <div id="avisos" class="avisos ui" role="status" aria-live="polite"></div>
  <section id="painel" class="painel ui" hidden aria-label="Painel da festa" data-i18n-label="app.panelLabel">
    <header class="painel-topo" data-arrastar="painel">
      <h1 id="painel-titulo">Cuide bem da sua mandioca</h1>
      <button class="fechar" data-action="fechar" title="Fechar (Esc)" data-i18n-title="app.closeEsc">×</button>
      <div class="bandeirinhas"></div>
    </header>
    <div class="painel-meio">
      <nav id="painel-abas" class="painel-abas" aria-label="Abas" data-i18n-label="app.tabsLabel"></nav>
      <div id="painel-corpo" class="painel-corpo"></div>
    </div>
  </section>
  <section id="argolas" class="minijogo ui" hidden aria-label="Argolas da Sorte" data-i18n-label="rings.title">
    <header class="painel-topo verde" data-arrastar="argolas">
      <h1 data-i18n="rings.title">Argolas da Sorte</h1>
      <button class="fechar" data-action="argolas-fechar" title="Fechar (Esc)" data-i18n-title="app.closeEsc">×</button>
      <div class="bandeirinhas"></div>
    </header>
    <div class="minijogo-corpo">
      <canvas id="argolas-canvas" aria-label="Barraca das argolas: clique para soltar a argola" data-i18n-label="rings.canvas"></canvas>
      <div id="argolas-info" class="minijogo-info"></div>
    </div>
  </section>
  <section id="tela" class="minijogo tela ui" hidden aria-label="Janela da festa" data-i18n-label="app.windowLabel">
    <header class="painel-topo azul" data-arrastar="tela">
      <h1 id="tela-titulo">Correio elegante</h1>
      <button class="fechar" data-action="tela-fechar" title="Fechar (Esc)" data-i18n-title="app.closeEsc">×</button>
      <div class="bandeirinhas"></div>
    </header>
    <div id="tela-corpo" class="painel-corpo tela-corpo"></div>
  </section>
  <div id="janela" class="janela ui" hidden role="dialog" tabindex="-1"><div id="janela-corpo"></div></div>
  <input id="importar" type="file" accept="application/json,.json" hidden>
  <script src="src/lang/pt-BR.js"></script>
  <script src="src/lang/en.js"></script>
  <script src="src/lang/es.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/settings.js"></script>
  <script src="src/data.js"></script>
  <script src="src/minis.js"></script>
  <script src="src/mini-cordel.js"></script>
  <script src="src/mini-bichos.js"></script>
  <script src="src/mini-aquario.js"></script>
  <script src="src/mini-horta.js"></script>
  <script src="src/mini-fogueira.js"></script>
  <script src="src/mini-palco.js"></script>
  <script src="src/mini-mata.js"></script>
  <script src="src/mini-ceu.js"></script>
  <script src="src/mini-bairro.js"></script>
  <script src="src/mini-folclore.js"></script>
  <script src="src/premios.js"></script>
  <script src="src/mundo.js"></script>
  <script src="src/looks.js"></script>
  <script src="src/core.js"></script>
  <script src="src/festa-sprites.js"></script>
  <script src="src/festa-folclore.js"></script>
  <script src="src/festa-premios.js"></script>
  <script src="src/festa-mundo-formas.js"></script>
  <script src="src/festa-mundo-temas.js"></script>
  <script src="src/festa-mundo-extras.js"></script>
  <script src="src/festa-mundo-extras2.js"></script>
  <script src="src/festa-mundo.js"></script>
  <script src="src/festa.js"></script>
  <script src="src/casa.js"></script>
  <script src="src/janela-base.js"></script>
  <script src="src/janelas.js"></script>
  <script src="src/janela-cordel.js"></script>
  <script src="src/janela-bichos.js"></script>
  <script src="src/janela-aquario.js"></script>
  <script src="src/janela-horta.js"></script>
  <script src="src/janela-fogueira.js"></script>
  <script src="src/janela-palco.js"></script>
  <script src="src/janela-mata.js"></script>
  <script src="src/janela-ceu.js"></script>
  <script src="src/janela-bairro.js"></script>
  <script src="src/argolas.js"></script>
  <script src="src/pescaria.js"></script>
  <script src="src/bingo.js"></script>
  <script src="src/som.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
