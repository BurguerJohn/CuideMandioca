    <template>
      <style>
        @font-face {
          font-family: "Fredoka";
          src: url("assets/fontes/Fredoka.ttf") format("truetype");
          font-weight: 300 700;
        }
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; font-family: "Fredoka", sans-serif; }

        /* Selo da festa: a espinha do trailer. Parado no canto do começo ao clímax; só o texto troca e o número conta. */
        #tx-selo { position: absolute; left: 96px; top: 72px; display: grid; background: #1c1a3a; border: 5px solid #2e1812;
          padding: 14px 26px 12px; box-shadow: 0 0 0 7px #c07a36, 0 0 0 13px #7c421e, 0 0 0 17px #2e1812, 10px 14px 0 17px rgba(18, 9, 6, 0.45); }
        /* Só o porte da vez aparece (os outros saem do layout): o selo tem a largura do nome atual, não do maior. */
        #tx-selo .porte { grid-area: 1 / 1; font-weight: 700; font-size: 30px; line-height: 1.15; letter-spacing: 0.06em;
          text-transform: uppercase; color: #fff4e4; white-space: nowrap; display: none; }
        #tx-selo .lotacao { grid-area: 2 / 1; font-family: "Space Mono", monospace; font-weight: 700; font-size: 40px; line-height: 1.1;
          color: #ffd21e; }
        #tx-selo .lotacao i { font-style: normal; font-family: "Fredoka", sans-serif; margin-right: 12px; }

        /* Legendas: creme com contorno, a palavra-chave em amarelo, no terço de cima (sobre o céu ou a planilha). */
        .tx-legenda { position: absolute; left: 96px; right: 96px; top: 300px; text-align: center; font-weight: 700; font-size: 84px;
          line-height: 1.06; color: #fff4e4; -webkit-text-stroke: 14px #1c1a3a; paint-order: stroke fill;
          text-shadow: 0 8px 0 rgba(18, 9, 6, 0.55); }
        .tx-legenda .linha { display: block; }
        .tx-legenda em { font-style: normal; color: #ffd21e; }
        .tx-legenda.embaixo { top: auto; bottom: 64px; }
        .tx-legenda.grande { font-size: 128px; top: 250px; }
        .tx-legenda.final { top: auto; bottom: 140px; font-size: 72px; -webkit-text-stroke-width: 12px; }

        /* Etiqueta do que acabou de acontecer, perto da ação. */
        .tx-pop { position: absolute; font-weight: 700; font-size: 40px; color: #2e1812; background: #ffd21e; border: 5px solid #2e1812;
          padding: 6px 22px 8px; border-radius: 999px; box-shadow: 0 6px 0 #2e1812; white-space: nowrap; }

        /* Placa do título: a mesma dos vídeos, com a Mandioca dançando em pixel exato. */
        .tx-placa { position: absolute; left: 510px; width: 900px; height: 300px; display: flex; align-items: flex-end; gap: 26px;
          padding: 0 38px 26px; background: #fff4e4; border: 6px solid #2e1812; transform-origin: 50% 0;
          box-shadow: 0 0 0 9px #c07a36, 0 0 0 18px #7c421e, 0 0 0 24px #2e1812, 16px 20px 0 24px rgba(18, 9, 6, 0.5); }
        .tx-placa .bandeiras { position: absolute; left: -6px; right: -6px; top: -6px; height: 54px; display: flex;
          justify-content: space-around; border-top: 6px solid #2e1812; }
        .tx-placa .bandeiras i { display: block; width: 44px; height: 50px; clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); }
        .tx-placa .bandeiras i:nth-child(6n + 1) { background: #ee2f3c; } .tx-placa .bandeiras i:nth-child(6n + 2) { background: #ffd21e; }
        .tx-placa .bandeiras i:nth-child(6n + 3) { background: #35a03a; } .tx-placa .bandeiras i:nth-child(6n + 4) { background: #3a6cf0; }
        .tx-placa .bandeiras i:nth-child(6n + 5) { background: #ff4f9e; } .tx-placa .bandeiras i:nth-child(6n + 6) { background: #ff8a12; }
        .tx-placa .mascote { position: relative; flex: none; width: 160px; height: 220px; }
        .tx-placa .corpo { position: absolute; inset: 0; background: url("assets/sprites/mandioca.png") 0 0 / 2560px 220px no-repeat;
          image-rendering: pixelated; }
        .tx-placa .chapeu { position: absolute; width: 120px; height: 45px; left: 20px; top: 25px; image-rendering: pixelated;
          background: url("assets/sprites/chapeu-palha.png") 0 0 / 100% 100% no-repeat; }
        .tx-placa .letreiro { display: flex; flex-direction: column; padding-bottom: 6px; }
        .tx-placa .l1 { font-weight: 700; font-size: 46px; line-height: 1; color: #2e1812; letter-spacing: 0.02em; white-space: nowrap; }
        .tx-placa .l2 { font-weight: 700; font-size: 124px; line-height: 0.95; color: #ee2f3c; letter-spacing: -0.03em; white-space: nowrap;
          -webkit-text-stroke: 7px #2e1812; paint-order: stroke fill; text-shadow: 0 8px 0 #8a1030; }

        #tx-flash { position: absolute; inset: 0; background: #fff4e4; opacity: 0; }
        #tx-preto { position: absolute; inset: 0; background: #1c1a3a; opacity: 0; }
      </style>

      <div data-hf-id="hf-qc8a" id="root" data-composition-id="textos" data-width="1920" data-height="1080">
        <div data-hf-id="hf-86ll" id="tx-selo" data-layout-allow-overlap="">

          <span data-hf-id="hf-5icy" class="lotacao"><i data-hf-id="hf-vx6q">👥</i><b data-hf-id="hf-0ip2" id="tx-convidados">1</b></span>
        </div>

        <div data-hf-id="hf-mlkw" class="tx-legenda" id="tx-leg-1"><span data-hf-id="hf-n4ug" class="linha">Uma festa junina que dança</span><span data-hf-id="hf-ua7d" class="linha">na sua <em data-hf-id="hf-9l06">área de trabalho</em></span></div>
        <div data-hf-id="hf-9sh3" class="tx-legenda embaixo" id="tx-leg-2a"><span data-hf-id="hf-grqk" class="linha">Cada passo rende <em data-hf-id="hf-7dbc">Animação</em></span></div>
        <div data-hf-id="hf-ywzg" class="tx-legenda embaixo" id="tx-leg-2b"><span data-hf-id="hf-fysn" class="linha">Melhore a dança</span><span data-hf-id="hf-f06m" class="linha">e <em data-hf-id="hf-e55x">vista a Mandioca</em></span></div>
        <div data-hf-id="hf-4d4z" class="tx-legenda embaixo" id="tx-leg-3"><span data-hf-id="hf-jwkg" class="linha">Cada convidado traz</span><span data-hf-id="hf-eb2t" class="linha"><em data-hf-id="hf-m5mc">algo novo</em> pra festa</span></div>
        <div data-hf-id="hf-gvng" class="tx-legenda embaixo" id="tx-leg-4"><span data-hf-id="hf-7z8j" class="linha"><em data-hf-id="hf-rlrq">Argolas da Sorte</em>, pescaria</span><span data-hf-id="hf-cpkw" class="linha">e uma turma inteira</span></div>
        <div data-hf-id="hf-hnb9" class="tx-legenda embaixo" id="tx-leg-5"><span data-hf-id="hf-xtjn" class="linha"><em data-hf-id="hf-zevt">Forró</em> no palco</span><span data-hf-id="hf-90hd" class="linha">e <em data-hf-id="hf-suvj">fogueira</em> acesa</span></div>
        <div data-hf-id="hf-1si2" class="tx-legenda grande" id="tx-leg-6"><span data-hf-id="hf-iz8w" class="linha">o <em data-hf-id="hf-ur97">MAIOR SÃO JOÃO</em></span><span data-hf-id="hf-wfpf" class="linha">DO MUNDO</span></div>
        <div data-hf-id="hf-fcse" class="tx-legenda final" id="tx-leg-7"><span data-hf-id="hf-06ah" class="linha">Um jogo <em data-hf-id="hf-bhd1">idle</em> de festa junina</span><span data-hf-id="hf-rl8h" class="linha">para a sua <em data-hf-id="hf-kj96">área de trabalho</em></span></div>

        <div data-hf-id="hf-9jjj" class="tx-pop" id="tx-pop-chapeu">Chapéu de Vaqueiro!</div>
        <div data-hf-id="hf-8xat" class="tx-pop" id="tx-pop-roupa">Xadrez Azul!</div>
        <div data-hf-id="hf-u6c3" class="tx-pop" id="tx-pop-milho">Milho entrou na turma!</div>
        <div data-hf-id="hf-lb0w" class="tx-pop" id="tx-pop-estrela">Animação ×2!</div>

        <div data-hf-id="hf-gw65" class="tx-placa" id="tx-placa-1" data-layout-allow-overflow="" data-layout-allow-overlap="">
          <div data-hf-id="hf-vdzz" class="bandeiras"><i data-hf-id="hf-wt6k"></i><i data-hf-id="hf-zeb8"></i><i data-hf-id="hf-y7e5"></i><i data-hf-id="hf-ylp6"></i><i data-hf-id="hf-0l8b"></i><i data-hf-id="hf-0zjc"></i><i data-hf-id="hf-zsm9"></i><i data-hf-id="hf-06xa"></i><i data-hf-id="hf-26gf"></i><i data-hf-id="hf-2krg"></i><i data-hf-id="hf-oz7w"></i><i data-hf-id="hf-okwv"></i><i data-hf-id="hf-o6lu"></i><i data-hf-id="hf-jqbp"></i></div>
          <div data-hf-id="hf-bv2e" class="mascote"><div data-hf-id="hf-2413" class="corpo" id="tx-corpo-1"></div><div data-hf-id="hf-37rd" class="chapeu" id="tx-chapeu-1"></div></div>
          <div data-hf-id="hf-fl10" class="letreiro"><span data-hf-id="hf-w9r0" class="l1">CUIDE BEM DA SUA</span><span data-hf-id="hf-cwoz" class="l2">MANDIOCA</span></div>
        </div>
        <div data-hf-id="hf-bgdz" class="tx-placa" id="tx-placa-7" data-layout-allow-overflow="">
          <div data-hf-id="hf-m3a7" class="bandeiras"><i data-hf-id="hf-qkg0"></i><i data-hf-id="hf-q64z"></i><i data-hf-id="hf-prty"></i><i data-hf-id="hf-pdix"></i><i data-hf-id="hf-hqsk"></i><i data-hf-id="hf-hchj"></i><i data-hf-id="hf-8d0n"></i><i data-hf-id="hf-8rbo"></i><i data-hf-id="hf-7kel"></i><i data-hf-id="hf-7ypm"></i><i data-hf-id="hf-9y8r"></i><i data-hf-id="hf-acjs"></i><i data-hf-id="hf-95mp"></i><i data-hf-id="hf-9jxq"></i></div>
          <div data-hf-id="hf-wyyy" class="mascote"><div data-hf-id="hf-6tsx" class="corpo" id="tx-corpo-7"></div><div data-hf-id="hf-wadr" class="chapeu" id="tx-chapeu-7"></div></div>
          <div data-hf-id="hf-y2j0" class="letreiro"><span data-hf-id="hf-cd3o" class="l1">CUIDE BEM DA SUA</span><span data-hf-id="hf-qwar" class="l2">MANDIOCA</span></div>
        </div>

        <div data-hf-id="hf-7u2o" id="tx-flash"></div>
        <div data-hf-id="hf-vfm2" id="tx-preto"></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          // Tempos da música no trailer: frases de 4 compassos; a emenda para o fim da música cai em 46,626 s.
          const BAR = 2.3048;
          const P = [0.58, 9.729, 18.947, 28.166, 37.407, 46.626];
          const FIM = 58.65;

          // A Mandioca das placas dança com os quadros do próprio jogo; o chapéu acompanha a cabeça quadro a quadro.
          const CABECA = [[4, 5], [3, 4], [3, 3], [4, 4], [4, 5], [5, 4], [5, 3], [4, 4]];
          for (const n of [1, 7]) {
            const corpo = document.getElementById("tx-corpo-" + n);
            const chapeu = document.getElementById("tx-chapeu-" + n);
            const quadro = { f: 0 };
            const mostrar = () => {
              const f = Math.min(7, Math.floor(quadro.f));
              corpo.style.backgroundPosition = `${-f * 160}px 0px`;
              chapeu.style.left = `${CABECA[f][0] * 5}px`;
              chapeu.style.top = `${CABECA[f][1] * 5}px`;
            };
            tl.fromTo(quadro, { f: 0 }, { f: 8, duration: 1, ease: "none", repeat: Math.max(0, Math.floor(FIM) - 1), onUpdate: mostrar }, 0);
            mostrar();
          }

          // Legenda: as linhas sobem juntas (power3.out) e saem num fade curto.
          const legenda = (id, entra, sai) => {
            const caixa = document.getElementById(id);
            tl.fromTo(caixa, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, entra);
            caixa.querySelectorAll(".linha").forEach((linha, i) => {
              tl.fromTo(linha, { y: 36 }, { y: 0, duration: 0.5, ease: "power3.out" }, entra + i * 0.08);
            });
            tl.to(caixa, { opacity: 0, duration: 0.25, ease: "power2.in" }, sai - 0.25);
          };
          // Etiqueta: chega do nada (scale 0 → 1, sem quicar) perto da ação e some depois de ~1,8 s.
          const etiqueta = (id, t, x, y, rot = -3) => {
            const el = document.getElementById(id);
            gsap.set(el, { left: x, top: y, rotation: rot, scale: 0, opacity: 0 });
            tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, t);
            tl.to(el, { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" }, t + 1.8);
          };

          // Selo: o porte troca por corte seco; o número conta.
          const portes = [0, 1, 2, 3, 4].map(k => document.getElementById("tx-porte-" + k));
          const porte = i => {
            portes.forEach((el, k) => tl.set(el, { display: k === i ? "block" : "none" }, TROCAS[i]));
          };
          const TROCAS = [5.19, P[2], P[3], P[4], P[5]];
          const lotacao = { n: 1 };
          const numero = document.getElementById("tx-convidados");
          const escreve = () => { numero.textContent = String(Math.round(lotacao.n)); };
          const conta = (valor, t, dur = 0.01) => tl.to(lotacao, { n: valor, duration: dur, ease: dur > 0.1 ? "power2.out" : "none", onUpdate: escreve }, t);
          escreve();

          // --- Cena 1: a placa cai no primeiro tempo forte e, no compasso 3, encolhe até virar o selo.
          gsap.set("#tx-placa-1", { top: 110 });
          tl.fromTo("#tx-placa-1", { y: -520, rotation: -4 }, { y: 0, rotation: 0, duration: 0.55, ease: "expo.out" }, 1.0);
          tl.fromTo("#tx-placa-1", { rotation: 0 }, { rotation: 1.4, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 1.55);
          // Centro da placa (960) até o centro do selo (~326); a origem é o topo, então só o topo desce até o do selo.
          tl.to("#tx-placa-1", { x: 326 - 960, y: 72 - 110, scale: 0.36, duration: 0.5, ease: "power3.inOut" }, 5.19 - 0.1);
          tl.to("#tx-placa-1", { opacity: 0, duration: 0.2, ease: "none" }, 5.19 + 0.2);
          tl.fromTo("#tx-selo", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 5.19 + 0.2);
          porte(0);
          legenda("tx-leg-1", 5.6, P[1] - 0.1);

          // --- Cena 2: melhorias a cada compasso; os convidados chegam no compasso 4.
          legenda("tx-leg-2a", P[1] + 0.35, P[1] + 2 * BAR - 0.15);
          legenda("tx-leg-2b", P[1] + 2 * BAR + 0.1, P[2] - 0.1);
          etiqueta("tx-pop-chapeu", P[1] + BAR, 1050, 230);
          etiqueta("tx-pop-roupa", P[1] + 2 * BAR, 1060, 420, 3);
          conta(4, P[1] + 3 * BAR); conta(6, P[1] + 3 * BAR + 0.8); conta(9, P[1] + 3 * BAR + 1.6);

          // --- Cena 3: o 10º convidado vira Quermesse no corte; o Milho entra na turma no compasso 4.
          porte(1);
          conta(10, P[2] + 0.1); conta(11, P[2] + BAR); conta(12, P[2] + 2 * BAR);
          legenda("tx-leg-3", P[2] + 0.4, P[3] - 0.1);
          etiqueta("tx-pop-milho", P[2] + 3 * BAR, 1170, 560);

          // --- Cena 4: Festa da Cidade; a estrela das Argolas encaixa no compasso 2.
          porte(2);
          conta(25, P[3]);
          legenda("tx-leg-4", P[3] + 0.35, P[4] - 0.1);
          etiqueta("tx-pop-estrela", P[3] + BAR, 1400, 300, 4);

          // --- Cena 5: São João Regional.
          porte(3);
          conta(50, P[4]);
          legenda("tx-leg-5", P[4] + 0.35, P[5] - 0.2);

          // --- Cena 6: flash na emenda; o selo conta até 101; a legenda grande entra quando a câmera trava.
          tl.fromTo("#tx-flash", { opacity: 0 }, { opacity: 0.95, duration: 0.1, ease: "power2.in" }, P[5] - 0.1);
          tl.to("#tx-flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, P[5]);
          porte(4);
          conta(101, P[5] + 0.1, 1.8);
          legenda("tx-leg-6", P[5] + 2 * BAR, P[5] + 3 * BAR - 0.05);

          // --- Cena 7: o selo sai; a placa cai no centro; a linha final entra no último tempo forte e tudo para.
          const C7 = P[5] + 3 * BAR;
          tl.to("#tx-selo", { opacity: 0, duration: 0.3, ease: "power2.in" }, C7 - 0.3);
          gsap.set("#tx-placa-7", { top: 250 });
          tl.fromTo("#tx-placa-7", { y: -620, rotation: -4, opacity: 1 }, { y: 0, rotation: 0, duration: 0.6, ease: "expo.out" }, C7 + 0.15);
          tl.fromTo("#tx-placa-7", { rotation: 0 }, { rotation: 1.2, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, C7 + 0.75);
          legenda("tx-leg-7", C7 + BAR, FIM + 1);
          tl.fromTo("#tx-preto", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.in" }, FIM - 0.45);

          window.__timelines["textos"] = tl;
        })();
      </script>
    </template>
  </body>
