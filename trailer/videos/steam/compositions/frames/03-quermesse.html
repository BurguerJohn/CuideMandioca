        .e-mundo video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

      </style>

      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          // Câmera parada: o selo é a âncora e a festa muda em volta dele.
          tl.set("#e-mundo", { scale: 1 }, 0);
          window.__timelines["quermesse"] = tl;
        })();
      </script>
