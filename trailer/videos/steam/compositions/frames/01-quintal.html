<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: #1c1a3a; }
        /* O mundo é a câmera: translate + scale num só wrapper (origem no centro). O vídeo nunca é animado direto. */
        .q-mundo { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
        .q-mundo video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

      </style>

      <div data-hf-id="hf-arjf" id="root" data-composition-id="quintal" data-width="1920" data-height="1080">
        <div data-hf-id="hf-w6p3" class="q-mundo" id="q-mundo" data-layout-allow-overflow=""><video data-hf-id="hf-ub69" id="q-video" class="clip" src="assets/gameplay/steam-quintal.mp4" data-start="0" data-duration="9.729" data-media-start="0.3" data-track-index="0" muted playsinline></video></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          const S0 = 3;
          const alvo = { x: 1352 - 960, y: 720 - 540 };
          // No close a Mandioca fica abaixo do centro (y ≈ 690): a placa do título cai em cima, sem cobrir o chapéu.
          const abaixo = 150;
          tl.fromTo("#q-mundo", { scale: S0, x: -alvo.x * S0, y: -alvo.y * S0 + abaixo },
            { scale: 1, x: 0, y: 0, duration: 1.7, ease: "expo.out" }, 2.885);
          tl.fromTo("#q-mundo", { filter: "blur(0px)" }, { filter: "blur(18px)", duration: 0.24, ease: "power2.in", immediateRender: false }, 9.729 - 0.24);
          window.__timelines["quintal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
