<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: #1c1a3a; }
        /* O mundo é a câmera: translate + scale num só wrapper (origem no centro). O vídeo nunca é animado direto. */
        .c-mundo { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
        .c-mundo video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

      </style>

      <div data-hf-id="hf-dnxz" id="root" data-composition-id="cidade" data-width="1920" data-height="1080">
        <div data-hf-id="hf-ywpf" class="c-mundo" id="c-mundo" data-layout-allow-overflow=""><video data-hf-id="hf-3otq" id="c-video" class="clip" src="assets/gameplay/steam-cidade.mp4" data-start="0" data-duration="6.914" data-media-start="1.6" data-track-index="0" muted playsinline></video></div>
        <div data-hf-id="hf-gm6x" class="c-mundo" id="c-mundo-palco" data-layout-allow-overflow=""><video data-hf-id="hf-elod" id="c-video-palco" class="clip" src="assets/gameplay/steam-palco.mp4" data-start="6.914" data-duration="2.327" data-media-start="0.3" data-track-index="0" muted playsinline></video></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          // A janela das Argolas um pouco maior e para a direita/baixo, longe do selo do canto (bordas do vídeo não aparecem).
          tl.set("#c-mundo", { scale: 1.1, x: 90, y: 50 }, 0);
          const S = 1.7;
          const palco = { x: 910 - 960, y: 625 - 540 };
          tl.set("#c-mundo-palco", { scale: S, x: -palco.x * S, y: -palco.y * S }, 0);
          window.__timelines["cidade"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
