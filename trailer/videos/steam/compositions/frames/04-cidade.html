<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: #1c1a3a; }
        /* O mundo é a câmera: translate + scale num só wrapper (origem no centro). O vídeo nunca é animado direto. */
        .c-mundo { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
        .c-mundo video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

      </style>

      <div data-hf-id="hf-dnxz" id="root" data-composition-id="cidade" data-width="1920" data-height="1080">
        <div data-hf-id="hf-ywpf" class="c-mundo" id="c-mundo" data-layout-allow-overflow=""><video data-hf-id="hf-3otq" id="c-video" class="clip" src="assets/gameplay/steam-cidade.mp4" data-start="0" data-duration="9.241" data-media-start="0" data-track-index="0" muted playsinline></video></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          // Uma brincadeira por compasso, na festa inteira: a câmera dá um leve empurrão na direção de cada uma (pontos
          // medidos com gravar.js --medir, em px de 1920x1080 da gravação). O deslocamento é limitado ao que a escala
          // permite, então a borda do vídeo nunca aparece.
          const COMPASSO = 2.305;
          const S = 1.14;
          const mira = (p, escala) => {
            const livreX = 960 * escala - 960;
            const livreY = 540 * escala - 540;
            return {
              scale: escala,
              x: Math.max(-livreX, Math.min(livreX, -(p.x - 960) * escala)),
              y: Math.max(-livreY, Math.min(livreY, -(p.y - 540) * escala))
            };
          };
          const pote = { x: 720, y: 441 };           // o pote pendurado no varal (quebra no fim do 1º compasso)
          const burro = { x: 588, y: 678 };          // o cavalete do rabo no burro
          const casamento = { x: 1122, y: 684 };     // os noivos debaixo do arco de flores
          const prato = { x: 1233, y: 640 };         // entre o Fogão a Lenha e a Mandioca (o prato voa de um ao outro)

          tl.fromTo("#c-mundo", mira({ x: 960, y: 540 }, 1.04), { ...mira(pote, S), duration: 0.9, ease: "power2.out" }, 0);
          tl.to("#c-mundo", { ...mira(burro, S), duration: 0.7, ease: "power2.inOut" }, COMPASSO - 0.15);
          tl.to("#c-mundo", { ...mira(casamento, S), duration: 0.7, ease: "power2.inOut" }, COMPASSO * 2 - 0.15);
          tl.to("#c-mundo", { ...mira(prato, 1.06), duration: 0.7, ease: "power2.inOut" }, COMPASSO * 3 - 0.15);
          window.__timelines["cidade"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
